version: '3.8'

services:
  mcp_server:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/app/data/advisor_memory.db
      - CHROMA_DB_PATH=/app/data/chroma_db
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
    volumes:
      - data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  data:
